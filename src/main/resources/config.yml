# DiscordUtils Configuration
# config-version - Do NOT change this value manually.
config-version: 7
# Set to true to log every caught broadcast to console - useful for diagnosing AFK/mini-game relay issues.
debug: false

# Web dashboard — registered with SwagAPI's shared IWebService at
# http://<swagapi-bind-ip>:<swagapi-port>/swagapi/discordutils/
# Login is handled by SwagAPI's own panel accounts — there is no separate dashboard password.
dashboard:
  enabled: true

# Named Discord webhook URLs. This is the recommended way to get messages into
# Discord - no bot token, no privileged intents, no gateway connection needed.
# Each key below is checked by its matching feature before falling back to the bot
# (if one is connected). Leave a URL blank to use the bot for that category instead.
#
# You can also point ANY plugin's Discord notification at one of these by name -
# see the discordutils:notify event-bus channel in the README.
webhooks:
  chat: ""
  staff-chat: ""
  join-leave: ""
  afk: ""
  auction-house: ""
  punishments: ""
  deaths: ""
  server-messages: ""

# Digest mode — for discordutils:notify traffic only (chat/join-leave/etc. above are
# unaffected). Webhook names listed here buffer incoming messages instead of sending each
# one immediately, flushing everything buffered as a single combined embed every
# window-seconds. Useful for a chatty source (e.g. many small notifications in a short
# burst) that would otherwise spam the channel.
digest:
  enabled-webhooks: []
  window-seconds: 30

# IMPORTANT: You must enable the "Message Content Intent" (Privileged Gateway Intent)
# in your bot's settings at https://discord.com/developers/applications
# Without it, getContentDisplay() will always return empty for non-bot messages.
#
# The bot is now OPTIONAL. It's only needed for two-way features: Discord->Minecraft
# chat/staff-chat relay, DM-based /discordlink codes, and Discord role sync on link.
# Every other message category above works fine with just a webhook URL and no bot
# at all - leave bot-token unset if you don't need the two-way features.

# Your Discord bot token - get it from the Discord Developer Portal.
bot-token: "YOUR_BOT_TOKEN_HERE"

# Send a message to Discord when the bot connects/disconnects.
announce-status: true

formatting:
  # Parse MiniMessage tags (<red>, <bold>, <#FF5733>) and & codes in Minecraft chat.
  parse-minimessage: true
  # Strip formatting codes before sending to Discord (keeps Discord messages clean).
  strip-for-discord: true
  # Format for Minecraft messages sent to Discord.
  # Placeholders: {player}, {message}
  # {rank} comes from Vault prefix (falls back to group name, then "Player" if no Vault)
  discord-send-format: "**[{rank}] {player}**: {message}"

# Main Minecraft → Discord chat bridge.
chat:
  # Which entry from the 'servers' map below this channel belongs to.
  server: 1
  # The ID of the Discord channel to bridge with Minecraft chat.
  # Right-click the channel in Discord (with Developer Mode on) and click "Copy ID".
  channel-id: "YOUR_CHANNEL_ID_HERE"

discord-chat:
  # Master toggle for relaying Discord messages to Minecraft.
  enabled: true
  # If true, ALL Discord users can chat to Minecraft.
  # If false, only Discord users with the configured admin role can chat to Minecraft.
  # Use /discordchat allow all    -> sets this to true
  # Use /discordchat allow admins -> sets this to false
  allow-everyone: true
  # The name of the Discord role considered "admin" when allow-everyone is false.
  admin-role-name: "Admin"
  # Alternatively, set the Discord role ID (takes priority over name if not empty).
  admin-role-id: ""
  # Format for Discord messages shown in Minecraft.
  # Supports & color codes and MiniMessage tags.
  # Placeholders: {username}, {role}, {message}
  # {role} = the member's highest Discord role name (e.g. "Admin", "VIP")
  format: "&7[&bDiscord&7] &b[{role}] {username}&7: &f{message}"
  # Convert Discord **bold**, *italic*, ~~strikethrough~~ and __underline__ to
  # Minecraft formatting codes in the relayed message.
  convert-discord-markdown: true
  # Only these Discord roles will be shown as {role} in the Minecraft chat format.
  # The player's highest role from this list is used. Falls back to "Member" if none match.
  # Order here doesn't matter - Discord's role position hierarchy determines which is "highest".
  display-roles:
    - Owner
    - Manager
    - Admin
    - Mod
    - Helper
    - Support
    - Flea

# Auction House logging - logs listing, sale, and removal events to a Discord channel.
# Requires zAuctionHouse to be installed on the server.
auction-house:
  enabled: true
  # Which entry from the 'servers' map below this channel belongs to.
  server: 1
  # The Discord channel ID to send auction log embeds to.
  # Can be the same as chat.channel-id above, or a separate #auction-log channel.
  channel-id: "YOUR_AUCTION_CHANNEL_ID_HERE"

# Discord account linking - lets players run /discordlink to connect their Minecraft and Discord accounts.
# Requires: Discord application OAuth2 credentials (from https://discord.com/developers/applications)
link:
  # Your Discord Application's Client ID (OAuth2 > General > Client ID)
  client-id: "YOUR_CLIENT_ID_HERE"
  # Your Discord Application's Client Secret (OAuth2 > General > Client Secret)
  client-secret: "YOUR_CLIENT_SECRET_HERE"
  # The public IP or domain of your Minecraft server. Discord redirects here after OAuth2 authorization.
  # Example: "123.456.789.0" or "play.yourserver.com"
  server-ip: "YOUR_SERVER_IP_HERE"
  # Port for the embedded link HTTP server. Must be open/port-forwarded on your machine.
  port: 4567
  # Which entry from the 'servers' map below to use for role assignment.
  server: 1
  # The names of Discord roles that this plugin manages (one per rank).
  # These must exactly match the role names in your Discord server.
  # The plugin assigns the role whose name matches the player's LuckPerms group (case-insensitive).
  rank-role-names:
    - Default

# Multi-guild support - map server numbers to Discord guild IDs.
# The bot must be a member of every guild listed here (invite it with the bot OAuth2 scope).
# Use these server numbers in other config sections (e.g. punishments.server: 1).
servers:
  1:
    # Right-click your Discord server icon > Copy Server ID (Developer Mode must be on).
    guild-id: "YOUR_GUILD_ID_HERE"
  2:
    guild-id: "YOUR_SECOND_GUILD_ID_HERE"

# Punishment logging - posts a ban embed to a Discord channel whenever a player is banned.
punishments:
  enabled: false
  # Which entry from the 'servers' map above this channel belongs to.
  server: 1
  # The Discord channel ID to post ban embeds to.
  channel-id: "CHANNEL_ID_HERE"

# Join/leave messages sent to Discord when players connect or disconnect.
join-leave:
  enabled: true
  # Which entry from the 'servers' map above this channel belongs to.
  server: 1
  # The Discord channel ID to send join/leave embeds to.
  channel-id: "YOUR_CHANNEL_ID_HERE"
  # Placeholders: {player}
  join-format: ":green_circle: **{player}** joined the server."
  leave-format: ":red_circle: **{player}** left the server."

# AFK detection - works with CMI, EssentialsX, or any plugin that broadcasts AFK messages.
# We scan the broadcast for AFK-related keywords and then look for an online player's
# name in the same message. No regex config needed.
afk:
  enabled: true
  # Which entry from the 'servers' map above this channel belongs to.
  server: 1
  # The Discord channel ID to send AFK embeds to.
  channel-id: "YOUR_CHANNEL_ID_HERE"
  # Placeholders: {player}
  afk-format: ":zzz: **{player}** is now AFK."
  back-format: ":wave: **{player}** is no longer AFK."

# Staff chat bridge - relays in-game staff chat to a private Discord channel and back.
# Supports StaffChat (dev.pace) natively. Falls back to broadcast prefix matching for other plugins.
staff-chat:
  enabled: true
  # Which entry from the 'servers' map below this channel belongs to.
  server: 1
  # The Discord channel ID for the private staff channel.
  channel-id: "YOUR_STAFF_CHANNEL_ID_HERE"
  # Permission node used to filter who receives Discord → in-game staff messages.
  permission: "discordutils.staffchat"
  # (StaffChat plugin) Internal channel type string from StaffChat — leave as "staff" unless
  # you have customized it. Run /sctoggle and check console to confirm.
  channel-type: "staff"
  # Format for messages sent TO Discord from in-game staff chat.
  # Placeholders: {player}, {message}
  discord-format: ":shield: **[Staff] {player}**: {message}"
  # Format for messages coming FROM Discord to in-game (shown only to staff players).
  # Placeholders: {role}, {username}, {message}
  discord-to-minecraft-format: "&c[Staff Discord] &f[{role}] {username}&7: &f{message}"
  # Fallback: if StaffChat plugin is not detected, relay broadcasts that start with these prefixes.
  relay-prefixes:
    - "[Staff]"
    - "[SC]"

# Relay server/plugin broadcast messages (e.g. mini-game events) to Discord.
# BroadcastMessageEvent fires when Bukkit.broadcastMessage() is called by any plugin.
server-messages:
  enabled: true
  # Which entry from the 'servers' map above this channel belongs to.
  server: 1
  # The Discord channel ID to send server broadcast messages to.
  channel-id: "YOUR_CHANNEL_ID_HERE"
  # Only relay broadcasts whose text (after stripping color codes) starts with one of
  # these prefixes. Use "*" as the sole entry to relay ALL server broadcasts.
  relay-prefixes:
    - "[MiniGame]"
    - "[Trivia]"
    - "[Quiz]"
    - "[Event]"
  # Format sent to Discord. Placeholders: {message}
  discord-format: ":game_die: {message}"

# Bot presence and chat channel topic — shows live player count in Discord.
presence:
  enabled: true
  # Bot activity shown under its name in Discord. Placeholders: {online}, {max}
  format: "{online}/{max} players online"
  # Also update the chat channel's topic with the player count on join/leave.
  # Note: Discord rate-limits topic edits (~2 per 10 minutes). Rapid bursts queue and apply the latest value.
  update-chat-topic: true
  topic-format: "{online}/{max} players online"

# /discord in-game command — sends a clickable Discord invite link.
# Disabled by default to avoid conflicting with other /discord commands.
discord-invite:
  enabled: false
  url: "YOUR_INVITE_HERE"

# Death messages — relays player death messages to a Discord channel.
deaths:
  enabled: false
  server: 1
  channel-id: "YOUR_CHANNEL_ID_HERE"
  # Placeholders: {message} = the full vanilla death message (e.g. "Steve was slain by Zombie")
  format: ":skull: {message}"
