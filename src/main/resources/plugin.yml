name: DiscordUtils
version: 1.3.0
main: com.swag.discordutils.DiscordUtils
api-version: 1.20
description: Discord bridge plugin - webhook and bot-based chat/notification relay for the Swag617 ecosystem.

depend: [SwagAPI]

softdepend:
  - Vault
  - LuckPerms
  - CMI
  - zAuctionHouse
  - AuctionHouse
  - AH
  # Add Essentials here if you switch to EssentialsX for AFK support

commands:
  discordchat:
    description: Toggle who can chat from Discord to Minecraft.
    usage: /discordchat <allow|deny> <all|admins>
    permission: discordutils.admin
  discordlink:
    description: Link your Minecraft account to your Discord account.
    usage: /discordlink
    permission: discordutils.link
  discordunlink:
    description: Unlink your Minecraft account from Discord.
    usage: /discordunlink
    permission: discordutils.link
  discord:
    description: Get the Discord invite link.
    usage: /discord
    permission: discordutils.discord
permissions:
  discordutils.admin:
    description: Allows use of /discordchat command.
    default: op
  discordutils.link:
    description: Allows use of /discordlink command.
    default: true
  discordutils.formatting:
    description: Allows use of MiniMessage/hex formatting in chat.
    default: true
  discordutils.staffchat:
    description: Allows use of /sc and /staffchat, and receive in-game staff Discord messages.
    default: op
  discordutils.discord:
    description: Allows use of /discord command.
    default: true
