<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DiscordUtils</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>DiscordUtils — Webhooks</h1>
  <p class="sub">Named webhooks used by DiscordUtils' own categories and by any plugin publishing to
     <code>discordutils:notify</code>.</p>

  <table id="webhooks-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>URL</th>
        <th>Last sent</th>
        <th>Status</th>
        <th>Total sent</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="webhooks-body">
      <tr><td colspan="6" class="empty">Loading…</td></tr>
    </tbody>
  </table>

  <h2>Add / update a webhook</h2>
  <form id="webhook-form">
    <input type="text" id="name" placeholder="name (e.g. tournaments)" required>
    <input type="text" id="url" placeholder="https://discord.com/api/webhooks/..." required>
    <button type="submit">Save &amp; test</button>
  </form>
  <p id="form-status"></p>
</div>
<script src="app.js"></script>
</body>
</html>
